<!doctype html><meta charset="utf-8"><title>medir</title>
<body style="margin:0;background:#111;color:#eee;font:13px monospace">
<div id="out">medindo...</div>
<div id="box" style="position:absolute;left:-9999px;top:0"></div>
<script>
const paginas=['advogado-trabalhista-grande-vitoria-es.html','advogado-demissao-rescisao-grande-vitoria-es.html','advogado-acidente-de-trabalho-vitoria-es.html','advogado-direitos-trabalhistas-nao-pagos-grande-vitoria-es.html'];
const larguras=[1440,375];
const res={};
function medir(src,w){return new Promise(r=>{const f=document.createElement('iframe');f.width=w;f.height=800;f.src='/'+src;f.onload=()=>{setTimeout(()=>{let h=0;try{h=f.contentDocument.documentElement.scrollHeight}catch(e){}f.remove();r(h)},1200)};document.getElementById('box').appendChild(f)})}
(async()=>{for(const p of paginas){res[p]={};for(const w of larguras){res[p][w]=await medir(p,w)}}document.getElementById('out').textContent=JSON.stringify(res,null,1);window.__medidas=res})();
</script>
